services:
  devbyte:
    build: .
    container_name: devbyte-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      S3_TEMP_BUCKET: ${S3_TEMP_BUCKET}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_LONG_LIVED_TOKEN: ${META_LONG_LIVED_TOKEN}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID}
      FB_PAGE_ID: ${FB_PAGE_ID}
      FB_LONG_LIVED_TOKEN: ${FB_LONG_LIVED_TOKEN}
      MONGODB_URI: ${MONGODB_URI}
    volumes:
      # Secrets — read-only, never baked into the image
      - ./.env:/app/.env:ro
      - ./client_secrets.json:/app/client_secrets.json:ro
      # YouTube OAuth token — read-write (SDK may refresh it)
      - ./token.json:/app/token.json:rw
      # Runtime data — read-write (history, queues, rendered videos persist
      # outside the container so rebuilds don't wipe state)
      - ./data:/app/data:rw
      # Pipeline logs
      - ./logs:/app/logs:rw
    # No exposed ports — no web server at this stage

  postgres:
    image: postgres:17
    container_name: devbyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devbyte}
      POSTGRES_USER: ${POSTGRES_USER:-devbyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbyte -d devbyte"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
