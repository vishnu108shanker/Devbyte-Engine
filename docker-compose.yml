services:
  devbyte:
    build: .
    container_name: devbyte-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
    volumes:
      # Secrets — read-only, never baked into the image
      - ./.env:/app/.env:ro
      - ./client_secrets.json:/app/client_secrets.json:ro
      # YouTube OAuth token — read-write (SDK may refresh it)
      - ./token.json:/app/token.json:rw
      # Runtime data — read-write (history, queues, rendered videos persist
      # outside the container so rebuilds don't wipe state)
      - ./data:/app/data:rw
      # Pipeline logs
      - ./logs:/app/logs:rw
    # No exposed ports — no web server at this stage

  postgres:
    image: postgres:17
    container_name: devbyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devbyte}
      POSTGRES_USER: ${POSTGRES_USER:-devbyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbyte -d devbyte"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
